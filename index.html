<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameFinder - Buscador de Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Camada de personagens e ícones gamer flutuando no fundo -->
    <div class="floating-characters" id="floating-characters" aria-hidden="true"></div>

    <header>
        <div class="header-content">
            <h1>🎮 GameFinder</h1>
            <p>Encontre o jogo ideal com base nas suas preferências e confira preços reais</p>
        </div>
    </header>

    <main class="container">
        <aside class="filters">
            <h2>Características</h2>

            <div class="filter-group">
                <label for="search-input">Nome do Jogo</label>
                <input type="text" id="search-input" placeholder="Ex: Witcher, Hollow, God...">
            </div>

            <div class="filter-group">
                <label for="genre-select">Gênero</label>
                <select id="genre-select">
                    <option value="all">Todos os Gêneros</option>
                    <option value="RPG">RPG</option>
                    <option value="Ação">Ação</option>
                    <option value="Aventura">Aventura</option>
                    <option value="Estratégia">Estratégia</option>
                    <option value="Indie">Indie</option>
                    <option value="FPS">FPS</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="platform-select">Plataforma</label>
                <select id="platform-select">
                    <option value="all">Todas as Plataformas</option>
                    <option value="PC">PC</option>
                    <option value="PlayStation">PlayStation</option>
                    <option value="Xbox">Xbox</option>
                    <option value="Nintendo Switch">Nintendo Switch</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="mode-select">Modo de Jogo</label>
                <select id="mode-select">
                    <option value="all">Qualquer Modo</option>
                    <option value="Singleplayer">Singleplayer</option>
                    <option value="Multiplayer">Multiplayer</option>
                    <option value="Cooperativo">Cooperativo</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="price-select">Preço</label>
                <select id="price-select">
                    <option value="all">Qualquer Preço</option>
                    <option value="free">Gratuito (Free-to-Play)</option>
                    <option value="under100">Até R$ 100,00</option>
                    <option value="paid">Todos os Pagos</option>
                </select>
            </div>

            <button id="reset-btn" type="button">Limpar Filtros</button>
        </aside>

        <section class="results-section">
            <div class="results-header">
                <span id="results-count">Mostrando 0 jogos</span>
                <span class="price-note">* Preços baseados nos valores oficiais digitais (PC/Consoles)</span>
            </div>
            <div id="games-grid" class="games-grid"></div>
        </section>
    </main>

    <!-- Modal para visualizar a imagem e detalhes do jogo escolhido -->
    <div id="game-modal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-content">
            <button id="close-modal" class="close-modal" aria-label="Fechar">&times;</button>
            <img id="modal-img" src="" alt="Capa do jogo">
            <div class="modal-body">
                <h2 id="modal-title"></h2>
                <p id="modal-desc"></p>
                <div id="modal-tags" class="tags"></div>
                <div class="modal-footer">
                    <span id="modal-store"></span>
                    <span id="modal-price" class="modal-price"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
